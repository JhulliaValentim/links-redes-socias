<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jhullia Valentim | Links</title>

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    >

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style/style.css"
    >
</head>

<body>

    <div class="main-container">

        <header>

            <img
                src="assets/JhulliaFotoselfie.png"
                alt="Foto de Jhullia Valentim"
                class="profile-pic"
            >

            <h1>Jhullia Valentim</h1>

            <p class="job-title">
                Software Developer
            </p>

        </header>


       <main class="links-list">

    <a
        href="https://jhulliavalentimportifolio-seven.vercel.app/"
        class="link-item featured"
        target="_blank"
    >
        <i class="fa-solid fa-briefcase"></i>
        <span>Portfólio Profissional</span>
    </a>


    <a
        href="https://www.linkedin.com/in/jhulliavalentim/"
        class="link-item linkedin"
        target="_blank"
    >
        <i class="fa-brands fa-linkedin-in"></i>
        <span>LinkedIn</span>
    </a>


    <a
        href="https://github.com/JhulliaValentim"
        class="link-item github"
        target="_blank"
    >
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
    </a>


    <a
        href="https://www.instagram.com/jhulsvp/"
        class="link-item instagram"
        target="_blank"
    >
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
    </a>


    <a
        href="mailto:jhulliavalentim.dev@gmail.com"
        class="link-item email"
    >
        <i class="fa-regular fa-envelope"></i>
        <span>E-mail</span>
    </a>

</main>


        <footer>

            <button
                class="share-btn"
                onclick="sharePage()"
            >
                <i class="fa-solid fa-link"></i>
                Copiar link da página
            </button>

        </footer>

    </div>


    <script>

        function sharePage() {

            navigator.clipboard
                .writeText(window.location.href)
                .then(() => {

                    alert("Link copiado!");

                })
                .catch(() => {

                    alert("Não foi possível copiar o link.");

                });

        }

    </script>

</body>

</html>
